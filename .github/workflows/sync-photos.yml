name: Auto-Sync Google Photos

on:
  schedule:
    # Run every 6 hours in the cloud (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  # Allow manual trigger from GitHub Actions web UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage New Cloud Photos from Google Album
        run: |
          node scripts/sync-google-photos.js

      - name: Commit and push cloud staged updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain src/data/stagedProjects.json src/data/syncedMedia.json) ]]; then
            git add src/data/stagedProjects.json src/data/syncedMedia.json
            git commit -m "Cloud-stage new handyman album photos"
            git push
          else
            echo "No new cloud photos found to stage."
          fi
