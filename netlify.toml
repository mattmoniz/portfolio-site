[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent your site being embedded in iframes on other sites (clickjacking)
    X-Frame-Options = "DENY"

    # Prevent browsers guessing file types (MIME sniffing attacks)
    X-Content-Type-Options = "nosniff"

    # Control how much referrer info is sent when clicking links
    Referrer-Policy = "no-referrer-when-downgrade"

    # Force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Disable access to camera, mic, location — not needed on a portfolio
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

    # Allow required resources: fonts, emailjs, Netlify functions, Google Identity Services (SSO), and Google Cloud CDN images
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://api.emailjs.com /.netlify/functions/* https://accounts.google.com/gsi/ https://oauth2.googleapis.com; img-src 'self' data: https://randomuser.me https://lh3.googleusercontent.com https://*.googleusercontent.com https://*.google.com blob:; worker-src blob:;"
